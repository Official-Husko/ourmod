metadata:
  # uuid v7 as identifier (calculated from the table's name and version, so it changes if either changes)
  id: 017f3e5c-1b2a-7e4f-8d3c-9b6a1e2f4c5d
  # Game Title
  name: Sniper Elite 5
  # SteamAppID (used for auto-detecting the game process) OPTIONAL
  steamAppId: 1682620
  # Cheat table version
  version: 1.0.0
  # Author of the cheat table if one
  author: pawbeans
  # Description of the cheat table
  description: Native Linux/Proton trainer for Sniper Elite 5.

  logoUrl: https://cdn2.steamgriddb.com/logo/6d91cba46fdc9578e0c8f195890de004.png
  heroUrl: https://cdn2.steamgriddb.com/hero/27f3d04fe0ac180f00979ed6c77408bc.png
  headerUrl: https://cdn2.steamgriddb.com/hero/7d8a4a5ab298bab9ff02abda18040afe.png

  # One entry per binary/module format the game ships, keyed on PE vs ELF (not host OS).
  # A Windows PE build behaves identically whether it runs natively or under Wine/Proton —
  # Wine loads the real unmodified PE binary, so "windows" already covers both. Only a
  # genuinely separate native Linux (ELF) build, produced by a different compiler, would
  # need its own "linux" entry here. Sniper Elite 5 has no native Linux build, so only
  # "windows" is populated.
  platforms:
    windows:
      executable: Sniper5_vulkan.exe

  # Compatible game versions (should be steam build numbers and game version strings, if known). For multiple platforms like steam, gog, epic etc.
  compatibleVersions:
    - 1.0.0


# The actual cheat features, each with a name, hotkey, category, and the logic to implement it. Each feature can have multiple targets for different platforms (Windows vs Linux), and each target can be implemented via a hook or a simple patch.

# Still needs a way for the app to know what works for what platform and what versions

# Also we need a category section so the cheat maker can define categories and their order, and the app can display them in that order. and organize the cheats properly


features:

  - name: Immortality
    hotkey: F1
    category: Player
    stability: working
    note: "Your health can't drop to zero — you won't die from damage."

    targets:
      windows:
        type: hook
        signature:
          pattern: "F3 ?? ?? ?? 68 FF ?? 80 00 00 00 0F ?? ?? 68 ?? ?? 48"
          offset: 0

        # Code-cave hook: redirects execution into injected logic that forces health
        # every frame, then jumps back. This is how FLiNG-style trainers actually
        # implement Immortality - a plain byte patch/NOP can't express "check a flag,
        # then force a value" on its own.
        hook:
          type: abs64
          overwrite: 15

          original: "F3 0F 11 53 68 FF 90 80 00 00 00 0F 2F 7B 68"

          # FLiNG-generated cheat logic, but WITHOUT its final jump-back.
          # The engine generates that dynamically.
          body: >-
            83 BB 8C 00 00 00 01
            0F 85 0C 00 00 00
            C7 43 68 00 00 16 43
            F3 0F 10 53 68
            F3 0F 11 53 68
            FF 90 80 00 00 00
            0F 2F 7B 68

  - name: No Reload
    category: Weapons
    stability: untested
    note: "Your current magazine never runs dry, so you can keep firing without reloading."

    targets:
      windows:
        type: hook
        signature:
          pattern: "8B ?? 40 48 ?? ?? ?? 30 48 ?? ?? 20 ?? C3 48"
          offset: 0

        hook:
          type: abs64
          overwrite: 14
          original: "8B 43 40 48 8B 5C 24 30 48 83 C4 20 5F C3"
          body: >-
            C7 43 40 64 00 00 00 8B 43 40 48 8B 5C 24 30 48 83 C4 20 5F
            C3

